services:
  io_scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: io_scanner
    restart: unless-stopped
    environment:
      - FLASK_ENV=development
    volumes:
      - ./uploads:/app/uploads
      - ./resultados.csv:/app/resultados.csv
      - ./resultados.pdf:/app/resultados.pdf
      - ./scan_results.db:/app/scan_results.db
    cap_add:
      - NET_RAW
      - NET_ADMIN
    labels:
      - traefik.enable=true
      - traefik.http.routers.portscanner.rule=Host(`portscanner.usfq.edu.ec`)
      - traefik.http.routers.portscanner.entrypoints=websecure
      - traefik.http.routers.portscanner.tls=true
      - traefik.http.services.portscanner.loadbalancer.server.port=5000
    networks:
      - web
    expose:
      - "5000"

networks:
  web:
    external: true